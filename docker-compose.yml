version: '3'

services:
  payload:
    image: node:20-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - payload_data:/home/node/app/.payload
    working_dir: /home/node/app/
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@10.15.1 --activate &&
             pnpm install &&
             pnpm dev"
    env_file:
      - .env

  # Optional: local libSQL server that emulates Turso.
  # If you enable this service, also add `depends_on: ["libsql"]` under the payload service.
  # libsql:
  #   image: ghcr.io/libsql/sqld:0.24.23
  #   command:
  #     [
  #       "--http-listen-addr=0.0.0.0:8080",
  #       "--db-path=/var/lib/sqld/db.sqld",
  #       "--disable-auth"
  #     ]
  #   ports:
  #     - '8080:8080'
  #   volumes:
  #     - sqldata:/var/lib/sqld
  #   environment:
  #     # Provide a token if you enable auth; with --disable-auth a token is not required.
  #     - RUST_LOG=info

  # Optional: local S3-compatible storage for Cloudflare R2 testing.
  # Set your R2_* env vars to match the values below when running locally.
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data

volumes:
  payload_data:
  # sqldata:
  minio_data:
  node_modules:
