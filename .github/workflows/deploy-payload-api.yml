name: Deploy payload-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: payload-api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: honoyoga/pnpm-lock.yaml

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          for var in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN AUTH_BASE_URL TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is missing"
              exit 1
            fi
          done

      - name: Install worker dependencies
        run: pnpm --dir honoyoga install --frozen-lockfile

      - name: Write worker secrets file
        shell: bash
        env:
          AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = 'honoyoga/.ci-secrets.json'

          const secrets = {
            AUTH_BASE_URL: process.env.AUTH_BASE_URL,
            TURSO_DATABASE_URL: process.env.TURSO_DATABASE_URL,
            TURSO_AUTH_TOKEN: process.env.TURSO_AUTH_TOKEN,
          }

          for (const [key, value] of Object.entries(secrets)) {
            if (!value) {
              throw new Error(`${key} is missing`)
            }
          }

          fs.writeFileSync(path, JSON.stringify(secrets, null, 2))
          NODE

      - name: Deploy to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir honoyoga exec wrangler deploy --config wrangler.jsonc --secrets-file .ci-secrets.json
